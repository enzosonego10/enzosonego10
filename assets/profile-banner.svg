      <stop stop-color="#0D1117" />
      <stop offset="0.72" stop-color="#0D1117" />
      <stop offset="1" stop-color="#101820" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="8" fill="url(#fade)" />
  <rect width="1200" height="320" rx="8" fill="url(#grid)" opacity="0.48" />

