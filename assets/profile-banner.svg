<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner visual de EzSonego</title>
  <desc id="desc">Fundo escuro com textura de pixels, uma janela de terminal e a assinatura ENZOSONEGO10.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
